name: PolyBot (paper trading)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le bot
        env:
          START_BANKROLL: "100"
          STAKE: "2"
          MAX_STAKE_PCT: "0.25"
          MIN_EDGE: "0.06"
          DAILY_LOSS_LIMIT: "10"
          MIN_BANKROLL: "10"
          ASSETS: "btc,eth"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Sauvegarder les résultats
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add data/ learning.md
          git diff --cached --quiet || git commit -m "PolyBot: mise à jour $(date -u +%H:%M)"
          git pull --rebase --autostash || true
          git push || true
