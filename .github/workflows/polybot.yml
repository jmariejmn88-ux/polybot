name: PolyBot (paper trading)

# GitHub (plan gratuit) ne lance pas fiablement un workflow toutes les 5 min.
# Chaque lancement fait donc tourner le bot en continu ~5h45 (run_loop.py) :
# un passage par minute, sauvegarde des résultats toutes les 5 min.
# Le déclenchement horaire garde toujours une session prête à prendre le relais.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # pour relancer la session suivante à la fin de celle-ci

concurrency:
  group: polybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configurer git
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
      - name: Faire tourner le bot (~5h45)
        env:
          START_BANKROLL: "100"
          STAKE: "2"
          MAX_STAKE_PCT: "0.25"
          MIN_EDGE: "0.06"
          MODEL_WEIGHT: "0.5"   # modèle rapproché du prix du marché (moins de faux signaux)
          MIN_PRICE: "0.20"     # pas de pari sur les issues à moins de 20 ¢ (outsiders)
          DAILY_LOSS_LIMIT: "10"
          MIN_BANKROLL: "10"
          ASSETS: "btc,eth"
          # Module sport (simulation) : foot + NBA, cotes Pinnacle via PinnFeed (plan gratuit)
          SPORTS: "1"
          SPORTS_LIST: "foot,nba"
          SPORTS_START_BANKROLL: "100"
          SPORTS_STAKE: "2"
          SPORTS_MIN_EDGE: "0.03"
          # Cotes : PinnFeed si la clé existe (toutes les 10 min), sinon The Odds API
          # (5 grands championnats + Ligue des champions, ~5 recherches par jour, 500 crédits gratuits / mois)
          ODDS_LEAGUES: "epl,laliga,bundesliga,seriea,ligue1,ucl"
          PINNFEED_KEY: ${{ secrets.PINNFEED_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_loop.py --minutes 345 --every 60 --save-every 300
      # Le planificateur GitHub (cron) est très irrégulier sur le plan gratuit.
      # Chaque session relance donc la suivante elle-même. Annuler une session
      # à la main arrête la chaîne ; le cron horaire la redémarre plus tard.
      - name: Relancer la session suivante
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run polybot.yml --ref main --repo "${{ github.repository }}"
